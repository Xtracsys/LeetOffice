name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            mode: full
          - os: macos-latest
            mode: full
          # Windows compiles clean but the sync fixtures build file:// URLs
          # from Windows paths — runtime tests there land with path
          # hardening (tracked). Keep the platform visibly green.
          - os: windows-latest
            mode: build-only
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test (short — multicast/LAN e2e skip)
        if: matrix.mode == 'full'
        run: go test -short ./...
      - name: Build
        run: go build ./...
