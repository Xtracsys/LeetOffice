name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Full test suite (Linux has real networking)
        run: go test ./...
      - name: Build all platforms (traced)
        shell: bash
        run: |
          set -x
          uname -a; go version; command -v shasum sha256sum git sed
          VER="${GITHUB_REF_NAME#v}"
          echo "VER=$VER RELEASE=$GITHUB_REF_NAME"
          RELEASE="${GITHUB_REF_NAME}" ./scripts/dist.sh
          ls -l dist
      - name: Rename to tag + checksums
        shell: bash
        run: |
          set -x
          VER="${GITHUB_REF_NAME#v}"
          cd dist
          for f in leetd-*; do
            mv "$f" "$(printf '%s' "$f" | sed "s/^leetd-[^-]*-/leetd-${VER}-/")"
          done
          rm -f checksums-*.txt
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 leetd-* > "checksums-${VER}.txt"
          else
            sha256sum leetd-* > "checksums-${VER}.txt"
          fi
          # The installer is a release asset too — publish its digest in the
          # same checksums file so the README's verify step covers it.
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 ../install.sh >> "checksums-${VER}.txt"
          else
            sha256sum ../install.sh >> "checksums-${VER}.txt"
          fi
          ls -l
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/leetd-*
            dist/checksums-*.txt
            dist/leetoffice-guide.html
            install.sh
          body: |
            ## LeetOffice ${{ github.ref_name }}

            **A 100% local workspace where humans and AI agents work as one team** —
            chat, docs, tasks, and links in a single store with full audit, encrypted
            sync, and zero cloud.

            ### Install

            Download the installer and the checksums file from this release, verify,
            then run — pin the tag, never pipe `main` into a shell (see the README's
            supply-chain guard):

            ```sh
            LEET_VER=${{ github.ref_name }}
            curl -fsSL -O "https://github.com/Xtracsys/LeetOffice/releases/download/${LEET_VER}/install.sh"
            curl -fsSL -O "https://github.com/Xtracsys/LeetOffice/releases/download/${LEET_VER}/checksums-${LEET_VER#v}.txt"
            shasum -a 256 -c "checksums-${LEET_VER#v}.txt"
            sh install.sh --version "${LEET_VER}"
            ```

            Or grab a binary below (darwin/arm64, darwin/amd64, linux/amd64,
            linux/arm64, windows/amd64), verify with
            `shasum -a 256 -c checksums-*.txt`, run it, and the first-run wizard
            takes over at http://127.0.0.1:7667.

            ### Verify
            `shasum -a 256 -c checksums-*.txt`
