name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Full test suite (Linux has real networking)
        run: go test ./...
      - name: Build all platforms (traced)
        shell: bash
        run: |
          set -x
          uname -a; go version; command -v shasum sha256sum git sed
          VER="${GITHUB_REF_NAME#v}"
          echo "VER=$VER RELEASE=$GITHUB_REF_NAME"
          RELEASE="${GITHUB_REF_NAME}" ./scripts/dist.sh
          ls -l dist
      - name: Rename to tag + checksums
        shell: bash
        run: |
          set -x
          VER="${GITHUB_REF_NAME#v}"
          cd dist
          for f in leetd-*; do
            mv "$f" "$(printf '%s' "$f" | sed "s/^leetd-[^-]*-/leetd-${VER}-/")"
          done
          rm -f checksums-*.txt
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 leetd-* > "checksums-${VER}.txt"
          else
            sha256sum leetd-* > "checksums-${VER}.txt"
          fi
          ls -l
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/leetd-*
            dist/checksums-*.txt
          body: |
            ## LeetOffice ${{ github.ref_name }}

            **A 100% local workspace where humans and AI agents work as one team** —
            chat, docs, tasks, and links in a single store with full audit, encrypted
            sync, and zero cloud.

            ### Install and verify

            Download the binary for your platform and the matching
            `checksums-*.txt` file attached to this release. Verify the binary
            against its matching filename entry with your platform's SHA-256
            utility before running it. On first run, the wizard opens at
            http://127.0.0.1:7667.
